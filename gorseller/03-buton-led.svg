<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="770" viewBox="0 0 1420 770" role="img" aria-labelledby="title desc"><title id="title">Butonla LED kontrolü — mBlock blok yerleşimi</title><desc id="desc">Arduino başlangıç bloğuna bağlı sürekli tekrarla döngüsü içindeki 1 blok. Öğretim için yeniden çizim.</desc><defs><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r="1.2" fill="#dfe8ef"/></pattern></defs><rect width="1420" height="770" fill="#f5f9fc"/><rect width="1420" height="132" fill="#fff"/><rect width="1420" height="7" fill="#22a7ef"/><g font-family="Arial, sans-serif"><text x="48" y="37" font-size="18" fill="#1788b5" font-weight="700" dominant-baseline="middle">MUCİT AKADEMİSİ  /  mBlock ile Arduino</text><text x="48" y="78" font-size="32" fill="#172b46" font-weight="700" dominant-baseline="middle">03  Butonla LED kontrolü</text><text x="48" y="112" font-size="18" fill="#64748b" font-weight="500" dominant-baseline="middle">Dijital giriş • eğer / değilse • çıkış</text><rect x="28" y="152" width="895" height="552" rx="16" fill="#fff" stroke="#d7e4ee"/><rect x="30" y="154" width="891" height="548" rx="16" fill="url(#dots)"/><g transform="translate(60 178)"><path d="M0 25Q78-23 153 25H336q4 0 4 4v47q0 4-4 4H52l-8 8H24l-8-8H4q-4 0-4-4Z" fill="#FFBF00" stroke="#CC9900" stroke-width="1.5"/><text x="18" y="53" font-size="27" fill="#fff" font-weight="500" dominant-baseline="middle">Arduino başladığında</text></g><g transform="translate(60 258)"><path d="M4 0H16l8 8h20l8-8H495q4 0 4 4V60H74l-8 8H46l-8-8H26v300H499v22q0 4-4 4H4q-4 0-4-4V4q0-4 4-4Z" fill="#FFAB19" stroke="#CF8B17" stroke-width="1.5"/><text x="16" y="34" font-size="24" fill="#fff" font-weight="500" dominant-baseline="middle">sürekli tekrarla</text><g transform="translate(26 60)"><path d="M4 0H16l8 8h20l8-8H465q4 0 4 4V76H74l-8 8H46l-8-8H26v74H469v48H74l-8 8H46l-8-8H26v74H469v14q0 4-4 4H52l-8 8H24l-8-8H4q-4 0-4-4V4q0-4 4-4Z" fill="#FFAB19" stroke="#CF8B17" stroke-width="1.5"/><text x="15" y="39" font-size="22" fill="#fff" font-weight="500" dominant-baseline="middle">eğer</text><path d="M90 15H352L374 39L352 63H90L68 39Z" fill="#4C97D0" stroke="#3373AA" stroke-width="1.5"/><text x="90" y="39" font-size="22" fill="#fff" font-weight="500" dominant-baseline="middle">∞</text><text x="124" y="39" font-size="22" fill="#fff" font-weight="500" dominant-baseline="middle">Dijital pin okuma</text><rect x="308" y="22" width="44" height="34" rx="17" fill="#fff" stroke="#ffffff88"/><text x="320" y="39" font-size="21" fill="#575e75" font-weight="500" dominant-baseline="middle">2</text><text x="384" y="39" font-size="22" fill="#fff" font-weight="500" dominant-baseline="middle">ise</text><g transform="translate(26 76)"><path d="M4 0H16l8 8h20l8-8H437q4 0 4 4V60q0 4-4 4H52l-8 8H24l-8-8H4q-4 0-4-4V4q0-4 4-4Z" fill="#4C97D0" stroke="#3373AA" stroke-width="1.5"/><text x="15" y="35" font-size="22" fill="#fff" font-weight="500" dominant-baseline="middle">∞</text><text x="49" y="35" font-size="22" fill="#fff" font-weight="500" dominant-baseline="middle">dijital ayarla pin</text><rect x="214" y="18" width="44" height="34" rx="17" fill="#fff" stroke="#ffffff88"/><text x="226" y="35" font-size="21" fill="#575e75" font-weight="500" dominant-baseline="middle">13</text><text x="268" y="35" font-size="22" fill="#fff" font-weight="500" dominant-baseline="middle">çıkış</text><rect x="326" y="16" width="100" height="38" rx="5" fill="#3373AA" fill-opacity=".24" stroke="#3373AA"/><text x="336" y="35" font-size="21" fill="#fff" font-weight="500" dominant-baseline="middle">yüksek</text><path d="M405 31h12l-6 7z" fill="white"/></g><text x="16" y="174" font-size="22" fill="#fff" font-weight="500" dominant-baseline="middle">değilse</text><g transform="translate(26 198)"><path d="M4 0H16l8 8h20l8-8H431q4 0 4 4V60q0 4-4 4H52l-8 8H24l-8-8H4q-4 0-4-4V4q0-4 4-4Z" fill="#4C97D0" stroke="#3373AA" stroke-width="1.5"/><text x="15" y="35" font-size="22" fill="#fff" font-weight="500" dominant-baseline="middle">∞</text><text x="49" y="35" font-size="22" fill="#fff" font-weight="500" dominant-baseline="middle">dijital ayarla pin</text><rect x="214" y="18" width="44" height="34" rx="17" fill="#fff" stroke="#ffffff88"/><text x="226" y="35" font-size="21" fill="#575e75" font-weight="500" dominant-baseline="middle">13</text><text x="268" y="35" font-size="22" fill="#fff" font-weight="500" dominant-baseline="middle">çıkış</text><rect x="326" y="16" width="94" height="38" rx="5" fill="#3373AA" fill-opacity=".24" stroke="#3373AA"/><text x="336" y="35" font-size="21" fill="#fff" font-weight="500" dominant-baseline="middle">düşük</text><path d="M399 31h12l-6 7z" fill="white"/></g></g><text x="465" y="372" font-size="27" fill="#fff" font-weight="500" dominant-baseline="middle">↶</text></g><text x="950" y="206" font-size="18" fill="#187a9e" font-weight="700" dominant-baseline="middle">BAĞLANTI</text><text x="950" y="242" font-size="20" fill="#334155" font-weight="400" dominant-baseline="middle">5V → buton → D2</text><text x="950" y="270" font-size="20" fill="#334155" font-weight="400" dominant-baseline="middle">D2 → 10 kΩ direnç → GND</text><text x="950" y="298" font-size="20" fill="#334155" font-weight="400" dominant-baseline="middle">Çıkış: kart üzerindeki L LED’i.</text><text x="950" y="361" font-size="18" fill="#187a9e" font-weight="700" dominant-baseline="middle">KOŞULU YERLEŞTİR</text><text x="950" y="397" font-size="20" fill="#334155" font-weight="400" dominant-baseline="middle">Pin kategorisindeki altıgen</text><text x="950" y="425" font-size="20" fill="#334155" font-weight="400" dominant-baseline="middle">Dijital pin okuma bloğunu</text><text x="950" y="453" font-size="20" fill="#334155" font-weight="400" dominant-baseline="middle">eğer bloğunun koşuluna tak.</text><text x="950" y="516" font-size="18" fill="#187a9e" font-weight="700" dominant-baseline="middle">BASILIYKEN</text><text x="950" y="552" font-size="20" fill="#334155" font-weight="400" dominant-baseline="middle">D2 yüksek → koşul doğru.</text><text x="950" y="580" font-size="20" fill="#334155" font-weight="400" dominant-baseline="middle">Üst koldaki blok LED’i yakar.</text><text x="950" y="643" font-size="18" fill="#187a9e" font-weight="700" dominant-baseline="middle">BIRAKILINCA</text><text x="950" y="679" font-size="20" fill="#334155" font-weight="400" dominant-baseline="middle">D2 düşük → koşul yanlış.</text><text x="950" y="707" font-size="20" fill="#334155" font-weight="400" dominant-baseline="middle">değilse kolu LED’i söndürür.</text><line x1="40" y1="722" x2="1380" y2="722" stroke="#d7e4ee"/><text x="48" y="745" font-size="16" fill="#64748b" font-weight="400" dominant-baseline="middle">mBlock görünümüne göre yeniden çizilmiş öğretim şeması. Ekran görüntüsü değildir; etiketler sürüme göre değişebilir.</text></g></svg>