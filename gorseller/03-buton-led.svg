<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="578" viewBox="0 0 1200 578"><rect width="1200" height="578" fill="#0f172a"/><g font-family="Arial, sans-serif"><text x="56" y="55" fill="#38bdf8" font-size="20" letter-spacing="3">MUCİT AKADEMİSİ / mBlock</text><text x="56" y="108" fill="white" font-size="36" font-weight="bold">3. Butonla LED kontrolü</text><text x="56" y="145" fill="#cbd5e1" font-size="19">Dijital giriş, koşul ve pull-down direncini öğren.</text><rect x="56" y="180" width="680" height="47" rx="10" fill="#b45309"/><text x="76" y="211" font-size="21" fill="white">Arduino Uno başladığında</text><rect x="56" y="233" width="680" height="47" rx="10" fill="#7c3aed"/><text x="76" y="264" font-size="21" fill="white">sürekli tekrarla</text><rect x="80" y="286" width="680" height="47" rx="10" fill="#7c3aed"/><text x="100" y="317" font-size="21" fill="white">eğer dijital pin 2 = 1 ise</text><rect x="80" y="339" width="680" height="47" rx="10" fill="#0369a1"/><text x="100" y="370" font-size="21" fill="white">dijital pin 13 → YÜKSEK</text><rect x="80" y="392" width="680" height="47" rx="10" fill="#7c3aed"/><text x="100" y="423" font-size="21" fill="white">değilse</text><rect x="80" y="445" width="680" height="47" rx="10" fill="#0369a1"/><text x="100" y="476" font-size="21" fill="white">dijital pin 13 → DÜŞÜK</text><text x="810" y="211" fill="#38bdf8" font-size="22">BAĞLANTI ÖZETİ</text><text x="810" y="250" fill="white" font-size="17">5V</text><text x="810" y="274" fill="#cbd5e1" font-size="13">Butonun bir tarafı</text><text x="810" y="315" fill="white" font-size="17">D2</text><text x="810" y="339" fill="#cbd5e1" font-size="13">Butonun diğer tarafı ve 10 kΩ direncin bir ucu</text><text x="810" y="380" fill="white" font-size="17">GND</text><text x="810" y="404" fill="#cbd5e1" font-size="13">10 kΩ direncin diğer ucu</text><text x="810" y="445" fill="white" font-size="17">D13</text><text x="810" y="469" fill="#cbd5e1" font-size="13">Kart üzerindeki L LED’i</text><text x="56" y="553" fill="#94a3b8" font-size="15">Temsili blok akışı • mBlock ekran görüntüsü değildir • 1 = YÜKSEK, 0 = DÜŞÜK</text></g></svg>