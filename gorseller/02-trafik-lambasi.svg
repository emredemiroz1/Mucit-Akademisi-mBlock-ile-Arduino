</text><text x="950" y="270" font-size="20" fill="#334155" font-weight="400" dominant-baseline="middle">D9 → sarı LED</text><text x="950" y="298" font-size="20" fill="#334155" font-weight="400" dominant-baseline="middle">D10 → yeşil LED</text><text x="950" y="361" font-size="18" fill="#187a9e" font-weight="700" dominant-baseline="middle">HER LED İÇİN</text><text x="950" y="397" font-size="20" fill="#334155" font-weight="400" dominant-baseline="middle">Pin → 330 Ω → LED anot (+)</text><text x="950" y="425" font-size="20" fill="#334155" font-weight="400" dominant-baseline="middle">LED katot (−) → GND</text><text x="950" y="488" font-size="18" fill="#187a9e" font-weight="700" dominant-baseline="middle">1. AŞAMA · KIRMIZI</text><text x="950" y="524" font-size="20" fill="#334155" font-weight="400" dominant-baseline="middle">D8 yüksek; D9 ve D10 düşük.</text><text x="950" y="552" font-size="20" fill="#334155" font-weight="400" dominant-baseline="middle">3 saniye bekle.</text><text x="950" y="615" font-size="18" fill="#187a9e" font-weight="700" dominant-baseline="middle">2. AŞAMA · YEŞİL</text><text x="950" y="651" font-size="20" fill="#334155" font-weight="400" dominant-baseline="middle">D10 yüksek; D8 ve D9 düşük.</text><text x="950" y="679" font-size="20" fill="#334155" font-weight="400" dominant-baseline="middle">3 saniye bekle.</text><text x="950" y="742" font-size="18" fill="#187a9e" font-weight="700" dominant-baseline="middle">3. AŞAMA · SARI</text><text x="950" y="778" font-size="20" fill="#334155" font-weight="400" dominant-baseline="middle">D9 yüksek; D8 ve D10 düşük.</text><text x="950" y="806" font-size="20" fill="#334155" font-weight="400" dominant-baseline="middle">1 saniye bekle.</text><text x="950" y="869" font-size="18" fill="#187a9e" font-weight="700" dominant-baseline="middle">BLOKLARI TEK TEK EKLE</text><text x="950" y="905" font-size="20" fill="#334155" font-weight="400" dominant-baseline="middle">Her mavi blok yalnızca bir pini</text><text x="950" y="933" font-size="20" fill="#334155" font-weight="400" dominant-baseline="middle">ayarlar. 12 bloğun tamamı aynı</text><text x="950" y="961" font-size="20" fill="#334155" font-weight="400" dominant-baseline="middle">sürekli tekrarla bloğunun içinde.</text><line x1="40" y1="1186" x2="1380" y2="1186" stroke="#d7e4ee"/><text x="48" y="1209" font-size="16" fill="#64748b" font-weight="400" dominant-baseline="middle">mBlock görünümüne göre yeniden çizilmiş öğretim şeması. Ekran görüntüsü değildir; etiketler sürüme göre değişebilir.</text></g></svg>