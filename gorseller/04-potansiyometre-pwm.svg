0" dominant-baseline="middle">PWM çıkışı: 0–255</text><text x="950" y="735" font-size="20" fill="#334155" font-weight="400" dominant-baseline="middle">Bekleme: 0.02 saniye.</text><line x1="40" y1="750" x2="1380" y2="750" stroke="#d7e4ee"/><text x="48" y="773" font-size="16" fill="#64748b" font-weight="400" dominant-baseline="middle">mBlock görünümüne göre yeniden çizilmiş öğretim şeması. Ekran görüntüsü değildir; etiketler sürüme göre değişebilir.</text></g></svg>