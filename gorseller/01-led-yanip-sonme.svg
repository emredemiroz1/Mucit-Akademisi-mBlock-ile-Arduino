text x="336" y="35" font-size="21" fill="#fff" font-weight="500" dominant-baseline="middle">düşük</text><path d="M399 31h12l-6 7z" fill="white"/></g><g transform="translate(26 252)"><path d="M4 0H16l8 8h20l8-8H206q4 0 4 4V60q0 4-4 4H52l-8 8H24l-8-8H4q-4 0-4-4V4q0-4 4-4Z" fill="#FFAB19" stroke="#CF8B17" stroke-width="1.5"/><rect x="15" y="18" width="44" height="34" rx="17" fill="#fff" stroke="#ffffff88"/><text x="27" y="35" font-size="21" fill="#575e75" font-weight="500" dominant-baseline="middle">1</text><text x="69" y="35" font-size="22" fill="#fff" font-weight="500" dominant-baseline="middle">saniye bekle</text></g><text x="437" y="338" font-size="27" fill="#fff" font-weight="500" dominant-baseline="middle">↶</text></g><text x="950" y="206" font-size="18" fill="#187a9e" font-weight="700" dominant-baseline="middle">01  BAŞLAT</text><text x="950" y="242" font-size="20" fill="#334155" font-weight="400" dominant-baseline="middle">Olaylar → Arduino başladığında.</text><text x="950" y="270" font-size="20" fill="#334155" font-weight="400" dominant-baseline="middle">Bu bloğu en üste koy.</text><text x="950" y="333" font-size="18" fill="#187a9e" font-weight="700" dominant-baseline="middle">02  DÖNGÜYÜ EKLE</text><text x="950" y="369" font-size="20" fill="#334155" font-weight="400" dominant-baseline="middle">Kontrol → sürekli tekrarla.</text><text x="950" y="397" font-size="20" fill="#334155" font-weight="400" dominant-baseline="middle">Dört bloğu döngünün içine yerleştir.</text><text x="950" y="460" font-size="18" fill="#187a9e" font-weight="700" dominant-baseline="middle">03  DEĞERLERİ AYARLA</text><text x="950" y="496" font-size="20" fill="#334155" font-weight="400" dominant-baseline="middle">Pin: 13. Önce yüksek, sonra düşük.</text><text x="950" y="524" font-size="20" fill="#334155" font-weight="400" dominant-baseline="middle">Her iki bekleme: 1 saniye.</text><text x="950" y="587" font-size="18" fill="#187a9e" font-weight="700" dominant-baseline="middle">BEKLENEN SONUÇ</text><text x="950" y="623" font-size="20" fill="#334155" font-weight="400" dominant-baseline="middle">Kart üzerindeki L LED’i 1 saniye</text><text x="950" y="651" font-size="20" fill="#334155" font-weight="400" dominant-baseline="middle">yanar, 1 saniye söner.</text><line x1="40" y1="674" x2="1380" y2="674" stroke="#d7e4ee"/><text x="48" y="697" font-size="16" fill="#64748b" font-weight="400" dominant-baseline="middle">mBlock görünümüne göre yeniden çizilmiş öğretim şeması. Ekran görüntüsü değildir; etiketler sürüme göre değişebilir.</text></g></svg>