<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="722" viewBox="0 0 1420 722" role="img" aria-labelledby="title desc"><title id="title">LED yakıp söndürme — mBlock blok yerleşimi</title><desc id="desc">Arduino başlangıç bloğuna bağlı sürekli tekrarla döngüsü içindeki 4 blok. Öğretim için yeniden çizim.</desc><defs><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r="1.2" fill="#dfe8ef"/></pattern></defs><rect width="1420" height="722" fill="#f5f9fc"/><rect width="1420" height="132" fill="#fff"/><rect width="1420" height="7" fill="#22a7ef"/><g font-family="Arial, sans-serif"><text x="48" y="37" font-size="18" fill="#1788b5" font-weight="700" dominant-baseline="middle">MUCİT AKADEMİSİ  /  mBlock ile Arduino</text><text x="48" y="78" font-size="32" fill="#172b46" font-weight="700" dominant-baseline="middle">01  LED yakıp söndürme</text><text x="48" y="112" font-size="18" fill="#64748b" font-weight="500" dominant-baseline="middle">Dijital çıkış • bekleme • sürekli tekrar</text><rect x="28" y="152" width="895" height="504" rx="16" fill="#fff" stroke="#d7e4ee"/><rect x="30" y="154" width="891" height="500" rx="16" fill="url(#dots)"/><g transform="translate(60 178)"><path d="M0 25Q78-23 153 25H336q4 0 4 4v47q0 4-4 4H52l-8 8H24l-8-8H4q-4 0-4-4Z" fill="#FFBF00" stroke="#CC9900" stroke-width="1.5"/><text x="18" y="53" font-size="27" fill="#fff" font-weight="500" dominant-baseline="middle">Arduino başladığında</text></g><g transform="translate(60 258)"><path d="M4 0H16l8 8h20l8-8H467q4 0 4 4V60H74l-8 8H46l-8-8H26v266H471v22q0 4-4 4H4q-4 0-4-4V4q0-4 4-4Z" fill="#FFAB19" stroke="#CF8B17" stroke-width="1.5"/><text x="16" y="34" font-size="24" fill="#fff" font-weight="500" dominant-baseline="middle">sürekli tekrarla</text><g transform="translate(26 60)"><path d="M4 0H16l8 8h20l8-8H437q4 0 4 4V60q0 4-4 4H52l-8 8H24l-8-8H4q-4 0-4-4V4q0-4 4-4Z" fill="#4C97D0" stroke="#3373AA" stroke-width="1.5"/><text x="15" y="35" font-size="2